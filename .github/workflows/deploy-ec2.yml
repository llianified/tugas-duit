name: Deploy to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -e
          echo "$SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e

            cd ~/tugas-duit

            echo "== Sync repository =="
            git fetch origin
            git reset --hard origin/main

            echo "== Install dependencies =="
            pnpm install --frozen-lockfile

            echo "== Build =="
            pnpm build

            echo "== Restart app =="
            sudo systemctl restart tugas-duit

            echo "== Health check =="
            sleep 3
            curl -fsS http://127.0.0.1:3000/api/health

            echo
            echo "== Deploy successful =="
            git log -1 --oneline
