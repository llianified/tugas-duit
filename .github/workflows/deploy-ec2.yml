name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -e
          echo "$SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          command_timeout: 20m
          script: |
            set -e

            cd ~/tugas-duit

            echo "== Sync tested commit =="
            git fetch origin main
            git reset --hard "${{ github.event.workflow_run.head_sha }}"

            echo "== Install dependencies =="
            pnpm install --frozen-lockfile

            echo "== Migrate database =="
            pnpm db:migrate

            echo "== Build =="
            pnpm build

            echo "== Restart app =="
            sudo systemctl restart tugas-duit

            echo "== Health check =="
            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                break
              fi

              if [ "$attempt" -eq 12 ]; then
                sudo systemctl status tugas-duit --no-pager || true
                exit 1
              fi

              sleep 5
            done

            echo
            echo "== Deploy successful =="
            git log -1 --oneline
