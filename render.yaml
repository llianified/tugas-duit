# Render hanya mempertahankan domain lama sebagai redirect sementara ke production AWS EC2.
# Service ini tidak menjalankan Next.js, tidak terhubung ke Neon, dan tidak menjalankan migrasi.

services:
  - type: web
    name: tugas-duit
    runtime: node
    plan: free
    branch: main
    buildCommand: ''
    startCommand: node redirect-server.js
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
